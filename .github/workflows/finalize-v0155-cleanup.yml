name: Final V0.155 cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v0155-cleanup.yml'

permissions:
  contents: write

jobs:
  verify-clean-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical V0.155 before cleanup
        shell: bash
        run: |
          set -euo pipefail
          find . \
            -path './.git' -prune -o \
            -path './.import-v0155-final' -prune -o \
            -path './.github/workflows/finalize-v0155-cleanup.yml' -prune -o \
            -type f -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > /tmp/v0155-before.sha256
          test "$(wc -l < /tmp/v0155-before.sha256 | tr -d ' ')" = "268"
          echo '6a3b2952ba8a1219d25be2736c2304e5450fe9b207094c42cecd39a8d58b9e34  /tmp/v0155-before.sha256' | sha256sum -c -

      - name: Remove transport and verifier then reverify
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .import-v0155-final
          rm -f .github/workflows/finalize-v0155-cleanup.yml
          find . \
            -path './.git' -prune -o \
            -type f -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > /tmp/v0155-after.sha256
          test "$(wc -l < /tmp/v0155-after.sha256 | tr -d ' ')" = "268"
          echo '6a3b2952ba8a1219d25be2736c2304e5450fe9b207094c42cecd39a8d58b9e34  /tmp/v0155-after.sha256' | sha256sum -c -

      - name: Commit clean tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Lock verified V0.155 source tree'
          git push origin HEAD:main
