name: Import exact Notre Table V0.286

on:
  push:
    branches:
      - main
    paths:
      - 'notre-table-v0.286-working.zip'

permissions:
  contents: write

jobs:
  import-v0286:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Verify exact V0.286 archive
        shell: bash
        run: |
          set -euo pipefail
          test -f notre-table-v0.286-working.zip
          echo "17c16a3a7322fb2f107abed3b6bf78731990094924e143a49a379d9266a6650a  notre-table-v0.286-working.zip" | sha256sum -c -

      - name: Extract and verify project version
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/notre-table-v0286
          mkdir -p /tmp/notre-table-v0286
          unzip -q notre-table-v0.286-working.zip -d /tmp/notre-table-v0286
          test -d /tmp/notre-table-v0286/notre-table-v0.286
          test -f /tmp/notre-table-v0286/notre-table-v0.286/package.json
          node -e "const p=require('/tmp/notre-table-v0286/notre-table-v0.286/package.json'); if(p.name!=='notre-table'||p.version!=='0.286.0'){throw new Error('Unexpected package identity/version: '+p.name+' '+p.version)}"

      - name: Replace repository working tree with exact V0.286 snapshot
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf -- {} +
          cp -a /tmp/notre-table-v0286/notre-table-v0.286/. .
          test -f package.json
          test -f package-lock.json
          test -f .github/workflows/validate.yml
          node -e "const p=require('./package.json'); if(p.version!=='0.286.0'){throw new Error('Imported version mismatch')}"

      - name: Commit exact checkpoint to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Import produced no repository changes."
            exit 1
          fi
          git commit -m "Import exact Notre Table V0.286 checkpoint"
          git push origin HEAD:main
