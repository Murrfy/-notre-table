name: Inspect partial V0.155 archive

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/inspect-partial-v0155.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect staged V0.155 archive
        shell: bash
        run: |
          set -u
          cat \
            .import-v0155/chunk000.b64 \
            .import-v0155/chunk001.b64 \
            .import-v0155/chunk002.b64 \
            .import-v0155/chunk003.b64 \
            .import-v0155/chunk004.b64 \
            .import-v0155/chunk005.b64 \
            .import-v0155/chunk006.b64 \
            .import-v0155/chunk007.b64 \
            .import-v0155/chunk008.b64 \
            .import-v0155/chunk009.b64 \
            .import-v0155/chunk010.b64 \
            .import-v0155/chunk011.b64 \
            .import-v0155/chunk012.b64 \
            .import-v0155/chunk013.b64 \
            .import-v0155/chunk014.b64 \
            .import-v0155/chunk014z.b64 > /tmp/partial.b64
          base64 --decode /tmp/partial.b64 > /tmp/partial.xz
          set +e
          xz -dc /tmp/partial.xz > /tmp/partial.tar 2>/tmp/xz.err
          xz_status=$?
          set -e
          echo "XZ_STATUS=$xz_status"
          echo "PARTIAL_XZ_BYTES=$(wc -c </tmp/partial.xz)"
          echo "PARTIAL_TAR_BYTES=$(wc -c </tmp/partial.tar)"
          echo '--- XZ ERROR ---'
          cat /tmp/xz.err || true
          echo '--- LAST COMPLETE TAR ENTRIES ---'
          set +e
          tar -tvf /tmp/partial.tar 2>/tmp/tar.err | tail -40
          tar_status=${PIPESTATUS[0]}
          set -e
          echo "TAR_STATUS=$tar_status"
          echo '--- TAR ERROR ---'
          cat /tmp/tar.err || true
