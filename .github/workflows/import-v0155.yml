# Re-run after all verified transport blocks are present.
name: Complete verified V0.155 source import

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-v0155.yml'

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify official V0.155
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=/tmp/notre-table-v0155
          rm -rf "$SOURCE" /tmp/v0155-partial.* /tmp/v0155-overlay.* /tmp/v0155-manifest.sha256
          mkdir -p "$SOURCE"

          cat \
            .import-v0155/chunk000.b64 \
            .import-v0155/chunk001.b64 \
            .import-v0155/chunk002.b64 \
            .import-v0155/chunk003.b64 \
            .import-v0155/chunk004.b64 \
            .import-v0155/chunk005.b64 \
            .import-v0155/chunk006.b64 \
            .import-v0155/chunk007.b64 \
            .import-v0155/chunk008.b64 \
            .import-v0155/chunk009.b64 \
            .import-v0155/chunk010.b64 \
            .import-v0155/chunk011.b64 \
            .import-v0155/chunk012.b64 \
            .import-v0155/chunk013.b64 \
            .import-v0155/chunk014.b64 \
            .import-v0155/chunk014z.b64 > /tmp/v0155-partial.b64
          base64 --decode /tmp/v0155-partial.b64 > /tmp/v0155-partial.xz
          set +e
          xz -dc /tmp/v0155-partial.xz > /tmp/v0155-partial.tar 2>/tmp/v0155-xz.err
          xz_status=$?
          tar -xf /tmp/v0155-partial.tar -C "$SOURCE" 2>/tmp/v0155-tar.err
          tar_status=$?
          set -e
          echo "Expected partial-archive truncation: xz=$xz_status tar=$tar_status"
          recovered_count=$(find "$SOURCE" -type f | wc -l | tr -d ' ')
          test "$recovered_count" = "194"

          cat \
            .import-v0155-overlay/part000.b64 \
            .import-v0155-overlay/part001.b64 \
            .import-v0155-overlay/part002.b64 \
            .import-v0155-overlay/part003.b64 \
            .import-v0155-overlay/part004.b64 \
            .import-v0155-overlay/part005.b64 \
            .import-v0155-overlay/part006.b64 \
            .import-v0155-overlay/part007.b64 \
            .import-v0155-overlay/part008.b64 \
            .import-v0155-overlay/part009.b64 \
            .import-v0155-overlay/part010.b64 \
            .import-v0155-overlay/part011.b64 \
            .import-v0155-overlay/part012.b64 \
            .import-v0155-overlay/part013.b64 \
            .import-v0155-overlay/part014.b64 \
            .import-v0155-overlay/part015.b64 \
            .import-v0155-overlay/part016_0.b64 \
            .import-v0155-overlay/part016_1.b64 \
            .import-v0155-overlay/part016_2.b64 \
            .import-v0155-overlay/part016_3.b64 \
            .import-v0155-overlay/part016_4.b64 \
            .import-v0155-overlay/part017_0.b64 \
            .import-v0155-overlay/part017_1.b64 \
            .import-v0155-overlay/part017_2.b64 \
            .import-v0155-overlay/part017_3.b64 \
            .import-v0155-overlay/part017_4.b64 > /tmp/v0155-overlay.b64
          base64 --decode /tmp/v0155-overlay.b64 > /tmp/v0155-overlay.tar.xz
          echo 'c4f84f78495e272ba6c26c6c5c9390639ea7b3c92c9ac72134ebd42f34c83f1e  /tmp/v0155-overlay.tar.xz' | sha256sum -c -
          tar -xJf /tmp/v0155-overlay.tar.xz -C "$SOURCE"

          rm -f "$SOURCE/supabase/migrations/202609150014_recipe_stock_alignment.sql"

          final_count=$(find "$SOURCE" -type f | wc -l | tr -d ' ')
          test "$final_count" = "268"
          (
            cd "$SOURCE"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > /tmp/v0155-manifest.sha256
          )
          echo '6a3b2952ba8a1219d25be2736c2304e5450fe9b207094c42cecd39a8d58b9e34  /tmp/v0155-manifest.sha256' | sha256sum -c -
          echo "V0.155 verified: $final_count files"

      - name: Replace staging tree with verified V0.155
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/notre-table-v0155/ ./
          final_count=$(find . -path './.git' -prune -o -type f -print | wc -l | tr -d ' ')
          test "$final_count" = "268"
          find . -path './.git' -prune -o -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > /tmp/repo-v0155-manifest.sha256
          echo '6a3b2952ba8a1219d25be2736c2304e5450fe9b207094c42cecd39a8d58b9e34  /tmp/repo-v0155-manifest.sha256' | sha256sum -c -

      - name: Commit verified V0.155 source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Verified tree already matches V0.155.'
            exit 0
          fi
          git commit -m 'Complete verified V0.155 source import'
          git push origin HEAD:main
