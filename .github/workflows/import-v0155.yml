name: Complete V0.155 source import

on:
  push:
    branches:
      - main
    paths:
      - '.import-v0155/fresh-038.b64'

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified V0.155 source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/notre-table-v0155
          mkdir -p /tmp/notre-table-v0155
          cat .import-v0155/fresh-*.b64 | base64 --decode > /tmp/notre-table-v0155.tar.xz
          tar -xJf /tmp/notre-table-v0155.tar.xz -C /tmp/notre-table-v0155
          rsync -a --delete --exclude='.git/' /tmp/notre-table-v0155/ ./

      - name: Commit V0.155 source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Complete V0.155 source import'
          git push origin HEAD:main
