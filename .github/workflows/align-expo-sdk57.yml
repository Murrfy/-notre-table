name: Align Expo SDK 57 dependencies

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/align-expo-sdk57.yml'

permissions:
  contents: write

jobs:
  align-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Use Node 22.16.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'

      - name: Install current lockfile
        run: npm ci --no-audit --no-fund

      - name: Align Expo SDK dependencies
        run: npx expo install --fix

      - name: Reinstall from updated lockfile
        run: npm ci --no-audit --no-fund

      - name: Full installed validation
        run: npm run ci:validate

      - name: Commit aligned dependency files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git commit -m "Align Expo SDK 57 dependencies"
          git push origin HEAD:main
