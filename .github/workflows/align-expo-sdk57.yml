name: Align Expo SDK 57 dependencies
# validation trigger after SDK invariant alignment

on:
  workflow_dispatch:
  push:
    branches:
      - ci/expo-sdk57-align-v0286
    paths:
      - '.github/workflows/align-expo-sdk57.yml'
      - 'scripts/environment-preflight.cjs'
      - 'scripts/audit-project.cjs'

permissions:
  contents: write

jobs:
  align-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
    steps:
      - name: Checkout safe validation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ci/expo-sdk57-align-v0286
          persist-credentials: true

      - name: Prove exact branch state
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo "BRANCH=$(git branch --show-current)"
          test "$(git branch --show-current)" = "ci/expo-sdk57-align-v0286"
          node -e "const p=require('./package.json'); console.log('APP='+p.version); console.log('EXPO='+p.dependencies.expo); if(p.version!=='0.286.0') process.exit(1)"
          grep -F "expect('dependencies','expo','~57.0.24');" scripts/environment-preflight.cjs
          grep -F "'expo-notifications':'~57.0.20'" scripts/audit-project.cjs

      - name: Use Node 22.16.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'

      - name: Install current lockfile
        run: npm ci --no-audit --no-fund

      - name: Align Expo SDK dependencies
        run: npx expo install --fix

      - name: Reinstall from updated lockfile
        run: npm ci --no-audit --no-fund

      - name: Full installed validation
        run: npm run ci:validate

      - name: Commit aligned dependency files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git commit -m "Align Expo SDK 57 dependencies"
          git push origin HEAD:ci/expo-sdk57-align-v0286
