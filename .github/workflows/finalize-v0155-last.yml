name: Finalize V0.155 clean tree

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v0155-last.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source before cleanup
        shell: bash
        run: |
          set -euo pipefail
          find . \
            -path './.git' -prune -o \
            -path './.import-v0155-final' -prune -o \
            -path './.github/workflows/finalize-v0155-last.yml' -prune -o \
            -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > /tmp/before
          test "$(wc -l < /tmp/before | tr -d ' ')" = "268"
          echo '6a3b2952ba8a1219d25be2736c2304e5450fe9b207094c42cecd39a8d58b9e34  /tmp/before' | sha256sum -c -
      - name: Clean transport and verify exact final tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .import-v0155-final
          rm -f .github/workflows/finalize-v0155-last.yml
          find . -path './.git' -prune -o -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > /tmp/after
          test "$(wc -l < /tmp/after | tr -d ' ')" = "268"
          echo '6a3b2952ba8a1219d25be2736c2304e5450fe9b207094c42cecd39a8d58b9e34  /tmp/after' | sha256sum -c -
      - name: Commit exact V0.155 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Lock exact V0.155 source tree'
          git push origin HEAD:main
