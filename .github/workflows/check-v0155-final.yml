name: Finalize verified V0.155 import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-v0155-final.yml'

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical V0.155 source tree
        shell: bash
        run: |
          set -euo pipefail
          find . \
            -path './.git' -prune -o \
            -path './.import-v0155-final' -prune -o \
            -path './.github/workflows/check-v0155-final.yml' -prune -o \
            -type f -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > /tmp/v0155-repo-manifest.sha256

          count=$(wc -l < /tmp/v0155-repo-manifest.sha256 | tr -d ' ')
          test "$count" = "268"
          echo '6a3b2952ba8a1219d25be2736c2304e5450fe9b207094c42cecd39a8d58b9e34  /tmp/v0155-repo-manifest.sha256' | sha256sum -c -
          echo "Verified canonical V0.155: $count files"

      - name: Remove import transport and temporary verifier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .import-v0155-final
          rm -f .github/workflows/check-v0155-final.yml

          find . \
            -path './.git' -prune -o \
            -type f -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > /tmp/v0155-clean-manifest.sha256

          count=$(wc -l < /tmp/v0155-clean-manifest.sha256 | tr -d ' ')
          test "$count" = "268"
          echo '6a3b2952ba8a1219d25be2736c2304e5450fe9b207094c42cecd39a8d58b9e34  /tmp/v0155-clean-manifest.sha256' | sha256sum -c -

      - name: Commit clean verified V0.155 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize verified V0.155 source import'
          git push origin HEAD:main
