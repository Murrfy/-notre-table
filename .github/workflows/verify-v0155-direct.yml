name: Diagnose V0.155 import segments

on:
  push:
    branches:
      - v0155-direct-import
    paths:
      - '.github/workflows/verify-v0155-direct.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print all candidate segment hashes
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq -w 0 12); do
            sha256sum ".import-v0155-overlay/part0${n}.b64"
          done

          cat .import-v0155-overlay/part013_0.b64 .import-v0155-overlay/part013_1.b64 .import-v0155-overlay/part013_2.b64 .import-v0155-overlay/part013_3.b64 .import-v0155-overlay/part013_4.b64 > /tmp/part013.b64
          sha256sum /tmp/part013.b64

          cat .import-v0155-overlay/part014a.b64 .import-v0155-overlay/part014b.b64 > /tmp/part014.b64
          sha256sum /tmp/part014.b64

          sha256sum .import-v0155-overlay/part015.b64

          cat .import-v0155-overlay/part016_0.b64 .import-v0155-overlay/part016_1.b64 .import-v0155-overlay/part016_2.b64 .import-v0155-overlay/part016_3.b64 .import-v0155-overlay/part016_4.b64 > /tmp/part016.b64
          sha256sum /tmp/part016.b64

          sha256sum .import-v0155-final/part017.b64
