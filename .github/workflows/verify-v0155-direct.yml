name: Verify and reconstruct V0.155 direct import

on:
  push:
    branches:
      - v0155-direct-import
    paths:
      - '.github/workflows/verify-v0155-direct.yml'

permissions:
  contents: write

jobs:
  verify-reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical overlay segments
        shell: bash
        run: |
          set -euo pipefail
          check() { printf '%s  %s\n' "$1" "$2" | sha256sum -c -; }

          check 42562460629f36bc4c0b58739a0a8a5017e31ed5e746ad4b2cd98215a81f5527 .import-v0155-overlay/part000.b64
          check 6e5492e50cfbf4e3b33caf027e60338de77819113d5239db00e6e6b8649cf368 .import-v0155-overlay/part001.b64
          check 7a165723055798c9a6c2767f0f9c9ac37f07437c49f45bbb5dd51c67e7e05f3b .import-v0155-overlay/part002.b64
          check 49ce6a07fa30972748a9dbe5e016a278a7850612125b002bc2422801e08ce421 .import-v0155-overlay/part003.b64
          check 464a032f78f88b8ad1d1ef1bcc743f060de7221b773c452dc3b4b2cecb581765 .import-v0155-overlay/part004.b64
          check ec34daffaa64f07a791a170a5f7cca5473d93c28c2bafffa71ed1dd9638e6f43 .import-v0155-overlay/part005.b64
          check 9880e3cc3469524eecd3267c8e8e74f44a1f58e639d48eb152e6a6f8643cf418 .import-v0155-overlay/part006.b64
          check 08959d2480d9930b95f4ea799fda125e3d95b9876e2c114cd9d925af5478859c .import-v0155-overlay/part007.b64
          check 785f93780ccbe31e3aadad8d34eae8518b83f1f8d3aa55268155faf95181ea0f .import-v0155-overlay/part008.b64
          check dec0171548b65a02742fb2a652290a1715d39a4c0e64c3d7d60899a3bd7b306d .import-v0155-overlay/part009.b64
          check f1631e36cb3ff28471a58c699753d5448b19e1f4506ea122d5f3bbd5816d702c .import-v0155-overlay/part010.b64
          check 3bac38633f5761863d98ebad21441c08b2598bc4711ef73ba9bf44a283447579 .import-v0155-overlay/part011.b64
          check f762f762a53f8daaa2b8dfef76f08f5a12f0a9ddc7b469cb1ab5e21d343990e6 .import-v0155-overlay/part012.b64

          cat .import-v0155-overlay/part013_0.b64 .import-v0155-overlay/part013_1.b64 .import-v0155-overlay/part013_2.b64 .import-v0155-overlay/part013_3.b64 .import-v0155-overlay/part013_4.b64 > /tmp/part013.b64
          check 505c2eb250689716577c9462da5f940303cbf925c038c56915fa30ac84fd0684 /tmp/part013.b64

          cat .import-v0155-overlay/part014a.b64 .import-v0155-overlay/part014b.b64 > /tmp/part014.b64
          check ae4aff910d8ec8227bba20c99b792a6c04d7d715710056bf26d8e5f027552034 /tmp/part014.b64

          check 026b042b7dc51a837e825dc2f312e8ea1056aba7af51cba028879ab0eaef1b17 .import-v0155-overlay/part015.b64

          cat .import-v0155-overlay/part016_0.b64 .import-v0155-overlay/part016_1.b64 .import-v0155-overlay/part016_2.b64 .import-v0155-overlay/part016_3.b64 .import-v0155-overlay/part016_4.b64 > /tmp/part016.b64
          check c58fa65d0db578bc3c55b5fdb0d6323df6b0419cdce8d0b8d2ea0117056f4b1b /tmp/part016.b64

          check 1db7c75fa1c5b6d43f2fd2039a5fe8c094560a197ef8fe7326ef936665303b7a .import-v0155-final/part017.b64

      - name: Reconstruct and strictly verify official V0.155
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=/tmp/notre-table-v0155
          rm -rf "$SOURCE" /tmp/v0155-partial.* /tmp/v0155-overlay.* /tmp/v0155-manifest.sha256
          mkdir -p "$SOURCE"

          cat \
            .import-v0155/chunk000.b64 \
            .import-v0155/chunk001.b64 \
            .import-v0155/chunk002.b64 \
            .import-v0155/chunk003.b64 \
            .import-v0155/chunk004.b64 \
            .import-v0155/chunk005.b64 \
            .import-v0155/chunk006.b64 \
            .import-v0155/chunk007.b64 \
            .import-v0155/chunk008.b64 \
            .import-v0155/chunk009.b64 \
            .import-v0155/chunk010.b64 \
            .import-v0155/chunk011.b64 \
            .import-v0155/chunk012.b64 \
            .import-v0155/chunk013.b64 \
            .import-v0155/chunk014.b64 \
            .import-v0155/chunk014z.b64 > /tmp/v0155-partial.b64
          base64 --decode /tmp/v0155-partial.b64 > /tmp/v0155-partial.xz

          set +e
          xz -dc /tmp/v0155-partial.xz > /tmp/v0155-partial.tar 2>/tmp/v0155-xz.err
          xz_status=$?
          tar -xf /tmp/v0155-partial.tar -C "$SOURCE" 2>/tmp/v0155-tar.err
          tar_status=$?
          set -e
          echo "Expected partial-archive truncation: xz=$xz_status tar=$tar_status"
          recovered_count=$(find "$SOURCE" -type f | wc -l | tr -d ' ')
          test "$recovered_count" = "194"

          cat \
            .import-v0155-overlay/part000.b64 \
            .import-v0155-overlay/part001.b64 \
            .import-v0155-overlay/part002.b64 \
            .import-v0155-overlay/part003.b64 \
            .import-v0155-overlay/part004.b64 \
            .import-v0155-overlay/part005.b64 \
            .import-v0155-overlay/part006.b64 \
            .import-v0155-overlay/part007.b64 \
            .import-v0155-overlay/part008.b64 \
            .import-v0155-overlay/part009.b64 \
            .import-v0155-overlay/part010.b64 \
            .import-v0155-overlay/part011.b64 \
            .import-v0155-overlay/part012.b64 \
            /tmp/part013.b64 \
            /tmp/part014.b64 \
            .import-v0155-overlay/part015.b64 \
            /tmp/part016.b64 \
            .import-v0155-final/part017.b64 > /tmp/v0155-overlay.b64

          base64 --decode /tmp/v0155-overlay.b64 > /tmp/v0155-overlay.tar.xz
          printf '%s  %s\n' c4f84f78495e272ba6c26c6c5c9390639ea7b3c92c9ac72134ebd42f34c83f1e /tmp/v0155-overlay.tar.xz | sha256sum -c -
          tar -xJf /tmp/v0155-overlay.tar.xz -C "$SOURCE"

          rm -f "$SOURCE/supabase/migrations/202609150014_recipe_stock_alignment.sql"
          final_count=$(find "$SOURCE" -type f | wc -l | tr -d ' ')
          test "$final_count" = "268"

          (
            cd "$SOURCE"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > /tmp/v0155-manifest.sha256
          )
          printf '%s  %s\n' 6a3b2952ba8a1219d25be2736c2304e5450fe9b207094c42cecd39a8d58b9e34 /tmp/v0155-manifest.sha256 | sha256sum -c -
          echo "V0.155 verified: $final_count files"

      - name: Replace import branch with verified V0.155
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/notre-table-v0155/ ./

          final_count=$(find . -path './.git' -prune -o -type f -print | wc -l | tr -d ' ')
          test "$final_count" = "268"
          find . -path './.git' -prune -o -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > /tmp/repo-v0155-manifest.sha256
          printf '%s  %s\n' 6a3b2952ba8a1219d25be2736c2304e5450fe9b207094c42cecd39a8d58b9e34 /tmp/repo-v0155-manifest.sha256 | sha256sum -c -

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete verified V0.155 source import'
          git push origin HEAD:v0155-direct-import
