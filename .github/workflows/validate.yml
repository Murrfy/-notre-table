name: Validate Notre Table

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CI: '1'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node 22.16.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'

      - name: Require committed npm lockfile
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is required for reproducible validation. Run the manual Bootstrap npm lockfile workflow, review the artifact, then commit it."
            exit 1
          fi

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Full installed validation
        run: npm run ci:validate

      - name: Generate release evidence manifest
        run: npm run release:evidence

      - name: Preserve Expo export evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notre-table-expo-exports-${{ github.sha }}
          path: .validation/
          if-no-files-found: error
          retention-days: 14

